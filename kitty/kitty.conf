# ── 글꼴 ─────────────────────────────────────────────────────────
# 본문/한글 모두 D2Coding (Nerd Font 패치본).
# 본문 폰트를 Menlo(기본값)로 두면 셀 폭 0.602em 과 한글 1.0em 이 어긋나
# 한글만 작게 보이므로, 본문까지 같은 폰트로 맞춘다.
font_family      D2KodingLigature Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# 한글(U+1100-11FF 등 조합형 자모)과 Nerd Font 아이콘은 본문 폰트가
# 그대로 커버하므로 symbol_map 불필요. 미수록 자모는 시스템 폴백에 맡긴다.

# ── 글꼴 크기 ────────────────────────────────────────────────────
font_size 13.0

# ── 색 테마: Sonokai (default style) ──────────────────────────────
include themes/sonokai.conf

# ── 커서 모양: line(beam) ────────────────────────────────────────
cursor_shape beam
# 커서 굵기(pt). 얇게/굵게 조절
cursor_beam_thickness 1.8
# 셸 통합이 커서 모양을 되돌리지 않게 함
shell_integration no-cursor

# ── 커서 애니메이션: 최대 ────────────────────────────────────────
# 커서 이동 궤적(trail). 값 = 커서가 머물러야 하는 최소 시간(ms).
# 1 = 사실상 모든 이동에 궤적이 붙음 (0 이면 비활성)
cursor_trail 1
# 잔상이 사라지는 속도(초). 느릴수록 꼬리가 길게 남음 (기본 0.1 0.4)
cursor_trail_decay 0.2 0.8
# 몇 칸 이상 움직여야 궤적을 그릴지 (기본 2). 1 = 한 칸만 움직여도
cursor_trail_start_threshold 1
# 깜박임을 부드러운 페이드로 (기본은 즉시 on/off)
cursor_blink_interval 0.5 ease-in-out
# 0 = 키 입력이 없어도 계속 깜박임 (기본 15초 후 정지)
cursor_stop_blinking_after 0
# 더 화려한 불꽃 궤적을 원하면 아래 주석 해제 (셰이더를 처음 한 번 내려받음)
# custom_shaders cursor-trail-blaze

# ── 탭 바: powerline round ───────────────────────────────────────
tab_bar_style powerline
tab_separator " ┇"
tab_powerline_style round
# 탭 이름 = 현재 디렉토리의 상위/현재 폴더 이름
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{'/'.join(tab.active_wd.rsplit('/', 2)[1:]) if tab.active_wd.count('/') > 1 else tab.active_wd.rsplit('/', 1)[-1]}"
active_tab_foreground   #e3e1e4
active_tab_background   #f85e84
active_tab_font_style   bold
inactive_tab_foreground #848089
inactive_tab_background #1a181a
inactive_tab_font_style normal

# ── 시작 디렉토리: ~/dev ─────────────────────────────────────────
startup_session startup.conf

# ── 새 탭은 항상 ~/dev 에서 시작 ────────────────────────────────
map --allow-fallback=shifted,ascii cmd+t       launch --type=tab --cwd=~/dev
map --allow-fallback=shifted,ascii kitty_mod+t launch --type=tab --cwd=~/dev

# ── 새 창(split)은 현재 디렉토리, 새 OS 창은 ~/dev ─────────────
map cmd+enter                                  launch --type=window --cwd=current
map kitty_mod+enter                            launch --type=window --cwd=current
map --allow-fallback=shifted,ascii cmd+n       launch --type=os-window --cwd=~/dev
map --allow-fallback=shifted,ascii kitty_mod+n launch --type=os-window --cwd=~/dev

# ── 한글 입력기 대응 ─────────────────────────────────────────────
# 한글 상태에서도 ctrl+<영문키> 가 ctrl+<한글자모> 가 아닌 ctrl+<영문키> 로 전달되게 한다.
# 매핑은 ime-ctrl-keys.py 가 a-z 전체에 대해 생성한다.
geninclude ime-ctrl-keys.py

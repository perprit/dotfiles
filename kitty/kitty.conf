font_family      D2Coding
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0
paste_actions quote-urls-at-prompt
tab_bar_style powerline
tab_separator " ┇"
tab_powerline_style round
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{'/'.join(tab.active_wd.rsplit('/', 2)[1:]) if tab.active_wd.count('/') > 1 else tab.active_wd.rsplit('/', 1)[-1]}"
active_tab_foreground   #e3e1e4
active_tab_background   #f85e84
active_tab_font_style   bold
inactive_tab_foreground #848089
inactive_tab_background #1a181a
inactive_tab_font_style normal
startup_session ~/.config/kitty/startup.conf
macos_option_as_alt yes
# BEGIN_KITTY_THEME
# Sonokai Sushia
include current-theme.conf
# END_KITTY_THEME
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map opt+backspace send_text all \x17
map shift+enter send_text all \e\r
map ctrl+enter launch --location=hsplit --cwd=current
map kitty_mod+enter launch --cwd=current
map cmd+enter launch --cwd=current
map kitty_mod+t launch --type=tab --cwd=~/develop
map cmd+t launch --type=tab --cwd=~/develop
map kitty_mod+n launch --type=os-window --cwd=current
map cmd+n launch --type=os-window --cwd=current
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+ㅊ copy_to_clipboard
map cmd+ㅍ paste_from_clipboard
map ctrl+ㅁ send_text all \x01
map ctrl+ㅊ send_text all \x03
map ctrl+ㅇ send_text all \x04
map ctrl+ㄷ send_text all \x05
map ctrl+ㄹ send_text all \x06
map ctrl+ㅎ send_text all \x07
map ctrl+ㅗ send_text all \x08
map ctrl+ㅑ send_text all \x09
map ctrl+ㅓ send_text all \x0a
map ctrl+ㅏ send_text all \x0b
map ctrl+ㅣ send_text all \x0c
map ctrl+ㅡ send_text all \x0d
map ctrl+ㅜ send_text all \x0e
map ctrl+ㅐ send_text all \x0f
map ctrl+ㅔ send_text all \x10
map ctrl+ㅂ send_text all \x11
map ctrl+ㄱ send_text all \x12
map ctrl+ㄴ send_text all \x13
map ctrl+ㅅ send_text all \x14
map ctrl+ㅕ send_text all \x15
map ctrl+ㅍ send_text all \x16
map ctrl+ㅈ send_text all \x17
map ctrl+ㅌ send_text all \x18
map ctrl+ㅛ send_text all \x19
map ctrl+ㅋ send_text all \x1a
map ctrl+shift+ㅊ copy_to_clipboard
map ctrl+shift+ㅍ paste_from_clipboard
map ctrl+shift+ㄴ paste_from_selection
map ctrl+shift+ㅈ close_window
map ctrl+ㅉ close_window
map ctrl+shift+ㅜ launch --type=os-window --cwd=current
map ctrl+shift+ㄹ move_window_forward
map ctrl+shift+ㅠ move_window_backward
map ctrl+shift+ㄱ start_resizing_window
map ctrl+ㄲ start_resizing_window
map ctrl+shift+ㅅ launch --type=tab --cwd=~/develop
map ctrl+ㅆ launch --type=tab --cwd=~/develop
map ctrl+shift+ㅂ close_tab
map ctrl+ㅃ close_tab
map ctrl+shift+ㅣ next_layout
map ctrl+shift+ㅋ toggle_layout stack
map ctrl+shift+ㄷ open_url_with_hints
map ctrl+ㄸ open_url_with_hints
map ctrl+shift+ㅕ kitten unicode_input
map ctrl+shift+ㅗ show_scrollback
map ctrl+shift+ㅎ show_last_command_output
map ctrl+shift+ㅐ pass_selection_to_program
map ctrl+ㅒ pass_selection_to_program
map ctrl+ㅠ>ㅍ send_text all \x02v
map ctrl+ㅠ>ㄴ send_text all \x02s
map ctrl+ㅠ>ㅂ send_text all \x02q
map ctrl+ㅠ>ㅐ send_text all \x02o
map ctrl+ㅠ>ㅈ send_text all \x02w
map ctrl+ㅠ>ㅎ send_text all \x02g
map ctrl+ㅠ>ㅊ send_text all \x02c
map ctrl+ㅠ>ㅔ send_text all \x02p
map ctrl+ㅠ>ㅜ send_text all \x02n
map ctrl+ㅠ>ㄷ send_text all \x02e
map ctrl+ㅠ>ㅗ send_text all \x02h
map ctrl+ㅠ>ㅓ send_text all \x02j
map ctrl+ㅠ>ㅏ send_text all \x02k
map ctrl+ㅠ>ㅣ send_text all \x02l
map ctrl+ㅠ>ㅌ send_text all \x02x
map ctrl+ㅠ>ㅋ send_text all \x02z
map ctrl+ㅠ>ㄱ send_text all \x02r
map ctrl+ㅠ>ㅠ send_text all \x02b
map ctrl+ㅠ>shift+n send_text all \x02N
map ctrl+ㅠ>shift+g send_text all \x02G
map ctrl+ㅠ>shift+d send_text all \x02D
map ctrl+ㅠ>shift+x send_text all \x02X
map ctrl+ㅠ>shift+h send_text all \x02H
map ctrl+ㅠ>shift+j send_text all \x02J
map ctrl+ㅠ>shift+k send_text all \x02K
map ctrl+ㅠ>shift+l send_text all \x02L
map ctrl+ㅠ>shift+w send_text all \x02W
map ctrl+ㅠ>shift+r send_text all \x02R
map ctrl+ㅠ>shift+t send_text all \x02T
map ctrl+ㅠ>shift+p send_text all \x02P
map ctrl+ㅠ>shift+/ send_text all \x02?
map ctrl+ㅠ>? send_text all \x02?
map ctrl+ㅠ>minus send_text all \x02-
map ctrl+ㅠ>1 send_text all \x021
map ctrl+ㅠ>2 send_text all \x022
map ctrl+ㅠ>3 send_text all \x023
map ctrl+ㅠ>4 send_text all \x024
map ctrl+ㅠ>5 send_text all \x025
map ctrl+ㅠ>6 send_text all \x026
map ctrl+ㅠ>7 send_text all \x027
map ctrl+ㅠ>8 send_text all \x028
map ctrl+ㅠ>9 send_text all \x029
map ctrl+ㅠ>[ send_text all \x02[
map ctrl+ㅠ>tab send_text all \x02\t
map ctrl+ㅠ>shift+tab send_text all \x02\x1b[Z
narrow_symbols U+AC00-U+D7AF 1
narrow_symbols U+1100-U+11FF 1
narrow_symbols U+3130-U+318F 1
allow_remote_control yes
cursor #ffffff
cursor_shape beam
cursor_trail 1
cursor_trail_start_threshold 0
cursor_trail_decay 0.2 0.8
cursor_blink_interval 0.8 ease-in-out
cursor_stop_blinking_after 0

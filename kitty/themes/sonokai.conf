# vim:ft=kitty
## name:     Sonokai
## author:   sainnhe (palette), adapted for kitty
## license:  MIT
## upstream: https://github.com/sainnhe/sonokai  (style: default)

# --- basic ---
foreground              #e2e2e3
background              #2c2e34
selection_foreground    #e2e2e3
selection_background    #3b3e48

# --- cursor ---
cursor                  #e2e2e3
cursor_text_color       #2c2e34

# --- links / borders ---
url_color               #76cce0
active_border_color     #76cce0
inactive_border_color   #414550
bell_border_color       #e7c664

# --- tab bar ---
tab_bar_background      #222327
active_tab_foreground   #2c2e34
active_tab_background   #76cce0
active_tab_font_style   bold
inactive_tab_foreground #7f8490
inactive_tab_background #33353f
inactive_tab_font_style normal

# --- 16 ANSI colors (sonokai upstream terminal mapping) ---
# black
color0  #181819
color8  #7f8490
# red
color1  #fc5d7c
color9  #fc5d7c
# green
color2  #9ed072
color10 #9ed072
# yellow
color3  #e7c664
color11 #e7c664
# blue
color4  #76cce0
color12 #76cce0
# magenta (purple)
color5  #b39df3
color13 #b39df3
# cyan (sonokai maps this slot to orange)
color6  #f39660
color14 #f39660
# white
color7  #e2e2e3
color15 #e2e2e3
